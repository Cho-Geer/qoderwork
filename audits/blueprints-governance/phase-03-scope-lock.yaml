- check_id: P03-CHK-2
  name: header_four_fields_present
  command: rg '^\*\*创建日期\*\*|^\*\*更新日期\*\*|^\*\*状态\*\*|^\*\*相关蓝图\*\*' per each
    of the 18 backfill targets (whole file == 4 hits); governance blueprint header region
    (head -10) == 4 hits (its fenced body example is format spec text, not a header)
  level: component
  pass_condition: 4_hits_per_backfill_target_and_governance_header
- check_id: P03-CHK-3
  name: v3_exempt_not_edited
  command: sha256sum blueprints/blueprint-audit-governance-evidence-and-status-closure-v3.md
  level: component
  pass_condition: equals a510b7a8677c03e7ea1561e48620b95acec8611c88ff7ad2ddc558e0aa930d66
- check_id: P03-CHK-4
  name: edges_single_side
  command: sed -n the 相关蓝图 field of the 3 dependent files equals the approved edge
    strings; target side carries 无 or no field; INDEX 反向边视图 derives 3 rows
  level: component
  pass_condition: dependent_side_3_edges_and_reverse_view_3_rows
