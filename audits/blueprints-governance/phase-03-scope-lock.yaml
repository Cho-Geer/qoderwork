- check_id: P03-CHK-1
  name: modification_ban_checked
  command: rg --fixed-strings "<basename>" audits/ -g '*.json' -g '*.yaml' per each
    of the 18 backfill targets before edit; zero exact-sha256 bindings per file; governance
    mentions without sha256 field do not block; frozen-bound would fall back to INDEX
    exemption
