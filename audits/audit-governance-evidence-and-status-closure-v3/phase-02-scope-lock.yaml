fix_contract:
  receipt_discrimination:
    target: .agents/skills/deterministic-implementation-planning/scripts/phase-progression.ts
    change: >-
      validateReceiptContract must discriminate the receipt schema through the shared
      parser parseAuditGovernanceV3Document as
      audit-phase-progression/v3::phase-progression-receipt, replacing the
      consumer-local comparison against PROGRESSION_SCHEMA. The receipt gains a
      document_kind field. PROGRESSION_SCHEMA may remain only as the plan-index marker
      literal used by isProgressionSchema.
    unchanged:
      - PROGRESSION_STATUSES and TOP_LEVEL_STATUSES enums
      - deriveTopLevelStatus semantics
      - parseManifest and validateManifestRows
      - receipt hash binding fields (plan_index_sha256, phase_file_sha256, audit_report_sha256, validator_output_sha256) and previous_status/new_status validation
  progression_gate:
    target: .agents/skills/deterministic-implementation-planning/scripts/validate-phase-progression.ts
    rule: >-
      The NOT_STARTED re-entrancy gate (next phase must be NOT_STARTED), dependency
      ACCEPTED requirement, top-level derived status check, and completion-gate
      consistency are preserved verbatim. Only the receipt discrimination call path
      changes to route through the shared parser.
  plan_index_marker:
    disposition: unchanged
    rule: >-
      The plan-index marker phase-progression/v1 (isProgressionSchema) remains the
      active progression metadata contract. The formal PLAN_SET and the three active
      plans are not migrated.
  audit_report_binding:
    disposition: deferred
    rule: >-
      The receipt audit_report_path/audit_verdict/audit_exit_code binding semantics are
      not tightened in this phase; they depend on phase 4-5 v3 audit reports. No live
      receipt is produced in this phase because no phase reaches ACCEPTED.
  template_fix:
    target: .agents/skills/deterministic-implementation-planning/PLAN-SET-TEMPLATE.md
    change: >-
      Add the progression contract the v3 template omitted: the index Progression
      schema marker phase-progression/v1, and each phase Progression status and
      Completion receipt lines, aligned with PLAN-TEMPLATE.md. This closes
      F-PHASE01-TEMPLATE-PROGRESSION-MARKER.
  scanner_refinement:
    target: scripts/lib/scan-governance-surface.ts
    change: >-
      Refine the consumer-local finding detection so it flags consumer-local
      interpretation of a v3 schema-family discriminator (any of the 17 SCHEMA_PAIRS,
      or pre-v3 stand-ins such as 2.1, 1.0, audit-boundary-matrix/v1,
      boundary-contract/v1) and does NOT flag the legitimate plan-index progression
      marker phase-progression/v1 used by isProgressionSchema. After the receipt
      discrimination is v3-ified, F-CONSUMER-LOCAL:phase-progression.ts:phase-progression/v1
      closes honestly; the remaining consumer-local findings (validate-audit,
      audit-boundary-precheck, capture-state, prepare-audit, generate-evidence-receipt,
      pre-check-evidence, templates) stay OPEN.
    constraint: the scanner must still call the shared parser and complete the full finding set.
  manifest_sync:
    target: scripts/lib/governance-surface-manifest.yaml
    change: >-
      Add scripts/lib/audit-governance-schema-v3.ts to the allowed_references of
      phase-progression.ts and validate-phase-progression.ts (and scan-governance-surface.ts
      if its hash changes), and update the sha256 of every modified registered asset, so
      the surface scan does not self-flag an illegal reference.
  conformance_extension:
    change: >-
      Declare the rewired phase-progression.ts and validate-phase-progression.ts as v3
      consumers in the conformance runner set; the corpus already contains
      audit-phase-progression/v3::phase-progression-receipt samples and mismatch probes.

findings_disposition:
  closes:
    - F-PHASE01-TEMPLATE-PROGRESSION-MARKER (template repaired)
    - F-CONSUMER-LOCAL:phase-progression.ts:phase-progression/v1 (receipt discrimination v3-ified; residual marker is legitimate plan metadata, scanner refined)
  stays_open:
