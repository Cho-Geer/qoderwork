purpose: >-
  Freeze PHASE-02: v3-ify the progression receipt discrimination by routing it
  through the shared parser (audit-phase-progression/v3::phase-progression-receipt),
  repair the v3 PLAN-SET template progression markers, synchronize the surface
  manifest, and refine the surface scanner so it distinguishes a consumer-local v3
  schema interpretation (a blocking finding) from the legitimate plan-index
  progression marker phase-progression/v1 (not a finding). The plan-index marker, the
  NOT_STARTED re-entrancy gate, and the receipt audit-report binding semantics are
  deliberately unchanged.

scope_decision:
  chosen: receipt_discrimination_v3_plus_template_fix_plus_scanner_refinement
  rejected_options:
    - v3-ify the plan-index progression marker (would break the admitted formal PLAN_SET P-02A gate and ripple into three active plans)
    - tighten receipt audit-report binding now (depends on phase 4-5 v3 audit reports)
  rationale: >-
    The progression system has two same-named layers. The plan-index marker
    phase-progression/v1 is plan metadata consumed only by the P-02A gate and is
    decoupled from v3 admission; it stays. The progression receipt schema is a v3
    schema-family document discrimination and must use the shared parser. The formal
    PLAN_SET PHASE-01 is NOT_STARTED, so the P-02A admission path never parses a
    receipt and the receipt discrimination change is zero-risk to admitted state.

