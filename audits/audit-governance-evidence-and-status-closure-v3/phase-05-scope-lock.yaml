fix_contract:
  finalize_audit_v3:
    target: .agents/skills/plan-audit-archiver/scripts/finalize-audit.ts
    change: >-
      Import the shared parser. Validate the input report is a parseable audit-governance-report/v3::audit-report
      (reject other schema kinds). Emit the LATEST pointer as audit-governance-latest/v3::latest-pointer
      (not plain markdown), binding the report path + report sha256 + the canonical/scope-lock hashes it settles.
      Keep atomic CAS (temp write + rename), keep AUDIT_VALIDATION_FAILED and LATEST_POINTER_CONFLICT fail-closed paths.
      Add a helper that produces the immutable report content (hash-stable, parseable v3 doc) so the report file itself
      is a valid audit-governance-report/v3 document, not arbitrary markdown.
  finalize_audit_tests:
    target: .agents/skills/plan-audit-archiver/scripts/__tests__/finalize-audit.test.ts
    change: >-
      Assert the published LATEST pointer parses as audit-governance-latest/v3::latest-pointer; assert the report file
      parses as audit-governance-report/v3::audit-report; keep the two fail-closed regressions
      (validator fail -> no publish, existing pointer -> no overwrite). Add a failure-mutation matrix test: for each
      mutation (report hash drift, wrong schema kind, missing canonical binding) the pointer is NOT published and the
      prior pointer (if any) is unchanged.
  scope_lock_template_v3:
    target: .agents/skills/plan-audit-archiver/templates/scope-lock-template.json
    change: >-
      Replace schema_version "1.0" with audit-scope-lock/v3 and provenance_level "v2.1-required" with "v3-required",
      matching the actual phase-scope-lock.yaml shape. Closes the final 2 OPEN findings
      (scope-lock-template.json:pre-v3-schema_version, scope-lock-template.json:provenance-exposure).
  manifest_sync:
    target: scripts/lib/governance-surface-manifest.yaml
    change: >-
      Register finalize-audit.ts as a consumer of audit-governance-report/v3 and audit-governance-latest/v3; update
      sha256 of finalize-audit.ts, scope-lock-template.json after edits; confirm ZERO open findings (NO_OPEN_FINDINGS).
  conformance_extension:
    targets:
      - scripts/lib/run-conformance.ts
      - scripts/lib/conformance-corpus/corpus.json
    change: >-
      Declare finalize-audit.ts discriminators (report/latest v3) as consumers; extend corpus with a v3 latest-pointer
      sample and a mismatch probe asserting the gate rejects non-v3 report/latest kinds.
  tests_v3:
    targets:
      - scripts/lib/__tests__/run-conformance.test.ts
      - scripts/lib/__tests__/scan-governance-surface.test.ts
    change: >-
      Update assertions to reflect NO_OPEN_FINDINGS and the new finalize-audit consumer.

