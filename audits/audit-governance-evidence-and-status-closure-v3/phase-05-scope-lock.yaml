purpose: >-
  Freeze PHASE-05: complete the v3 audit publication chain. v3-ify finalize-audit.ts so it
  emits an immutable audit-governance-report/v3::audit-report and an atomic hash-bound
  audit-governance-latest/v3::latest-pointer (CAS via temp+rename), keeping fail-closed
  behavior (no publish on validation failure, no overwrite on conflict). v3-ify
  scope-lock-template.json to audit-scope-lock/v3 + v3-required. Sync the governance surface
  manifest so all active assets are registered with v3 discriminators and ZERO open findings remain.
  Closes the final 2 OPEN findings (scope-lock-template.json:pre-v3-schema_version,
  scope-lock-template.json:provenance-exposure), bringing the surface scanner to NO_OPEN_FINDINGS.

scope_decision:
  chosen: finalize_audit_v3_publication_plus_template_v3_closing_final_findings
  deferred: []
  rationale: >-
    PHASE-04 built the v3 audit machinery (validate-audit/pre-check-evidence/prepare-audit).
    PHASE-05 is the publication step it lacked: immutable report + CAS LATEST pointer, plus the
    last template v3-ification. After PHASE-05 the surface has zero open findings and the chain
    can publish a v3 report + pointer. Formal phase ACCEPT for PHASE-03/04 still requires the
    independent audit (P-03..P-07) with EV receipts and MODEL_REVIEW; this scope lock authorizes
    PUBLICATION of a report/pointer but not a self-issued phase ACCEPT verdict.

