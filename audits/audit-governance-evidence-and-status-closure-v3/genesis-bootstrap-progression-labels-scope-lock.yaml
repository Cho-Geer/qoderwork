purpose: >-
  Freeze one narrow correction to the formal v3 PLAN_SET instance so it satisfies the
  live P-02A phase progression admission gate (validate-phase-progression.ts exit 0).
  The v3 PLAN_SET template dropped the active progression marker that the older
  template carries; this scope lock adds the three missing progression labels to the
  formal PLAN_SET instance only. It changes no code, no validator, and no shared
  parser. The template defect itself is recorded as a PHASE-01 finding to be surfaced
  and fixed by the surface/conformance work, not silently repaired here.

root_cause:
  diagnosis: >-
    validate-phase-progression.ts requires the plan index to declare
    progression_schema phase-progression/v1, requires the index top-level Status to
    equal the derived value, and requires each phase file to carry a Progression
    status. The formal v3 PLAN_SET, generated from the v3 PLAN-SET-TEMPLATE.md, lacks
    all three because that template omitted the active progression contract that
    PLAN-TEMPLATE.md prescribes.
  disposition: >-
    phase-progression/v1 is the live progression contract (used by three active plans
    and prescribed by PLAN-TEMPLATE.md), not a pre-v3 Plan, profile, bypass, receipt,
    or compatibility entry. audit-phase-progression/v3 is a future v3 schema-family
    receipt kind with no consumer yet; v3-ifying the progression validator is phase-2
    work and is not touched here.
  observed_failure:
    command: bun run .agents/skills/deterministic-implementation-planning/scripts/validate-phase-progression.ts plans/audit-governance-evidence-and-status-closure-v3/formal-plan-set PHASE-01
    exit_code: 1
    errors: [PROGRESSION_SCHEMA_REQUIRED]

fix_contract:
  required_edits:
    - file: plans/audit-governance-evidence-and-status-closure-v3/formal-plan-set/00-plan-index.md
      change: add a Progression schema metadata line declaring phase-progression/v1
    - file: plans/audit-governance-evidence-and-status-closure-v3/formal-plan-set/00-plan-index.md
      change: set top-level Status from NOT_STARTED to the derived value READY-FOR-IMPLEMENTATION
    - file: plans/audit-governance-evidence-and-status-closure-v3/formal-plan-set/01-phase-surface-conformance.md
      change: add a Progression status metadata line declaring NOT_STARTED
  required_outcome:
    command: bun run .agents/skills/deterministic-implementation-planning/scripts/validate-phase-progression.ts plans/audit-governance-evidence-and-status-closure-v3/formal-plan-set PHASE-01
    pass_condition: exit_0_and_stdout_ok_true
  forbidden:
    - any change to validate-phase-progression.ts or phase-progression.ts
    - any change to scripts/lib/audit-governance-schema-v3.ts
    - any change to PLAN-SET-TEMPLATE.md or PLAN-TEMPLATE.md (template fix deferred to PHASE-01)
    - changing REQ/DC selection, phase content, lifecycle authorization, or evidence level beyond the three progression labels
    - pre-v3 input, compatibility entry, generic bypass, phase ACCEPT, report, or LATEST publication

deferred_finding:
  finding_id: F-PHASE01-TEMPLATE-PROGRESSION-MARKER
  classification: cross_component_contract_inconsistency
  description: >-
    The v3 PLAN-SET-TEMPLATE.md omits the active progression marker that
    PLAN-TEMPLATE.md prescribes, so PLAN_SETs generated from the v3 template fail the
    live P-02A progression gate. This is a REQ-006/REQ-007 surface/conformance finding
    to be surfaced, retained, and closed by PHASE-01, not repaired under this scope.

