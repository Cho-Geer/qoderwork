fix_contract:
  validate_audit_v3:
    target: .agents/skills/plan-audit-archiver/scripts/validate-audit.ts
    change: >-
      Import parseAuditGovernanceV3Document from scripts/lib/audit-governance-schema-v3.ts.
      Replace PROVENANCE_LEVELS {v2.1-required, component-only} with {v3-required}. Replace the
      SCHEMA_VERSION check (schemaVersion !== "2.1") with acceptance of audit-governance-audit/v3
      contract and audit-governance-report/v3 report discriminators via the shared parser.
      Replace audit-boundary-matrix/v1 acceptance (matrix.schema_version !== "audit-boundary-matrix/v1")
      with audit-boundary-matrix/v3. Retarget every other inline discriminator (canonical/projection/
      receipt/scope-lock/approval/phase-progression/latest) to its v3 pair. Keep the READY_FOR_LLM_REVIEW
      gate. Enforce MODEL_REVIEW presence when eligible. Closes F-CONSUMER-LOCAL:validate-audit.ts:schema_version-2.1
      and F-CONSUMER-LOCAL:validate-audit.ts:audit-boundary-matrix/v1.
  prepare_audit_v3:
    target: .agents/skills/plan-audit-archiver/scripts/prepare-audit.ts
    change: >-
      Import the shared parser. Emit audit-governance-audit/v3::audit-contract (not schema_version "2.1")
      and audit-governance-report/v3::audit-report. Bind MODEL_REVIEW to the v3 boundary matrix
      (audit-boundary-matrix/v3). Replace --boundary-contract-version "boundary-contract/v1" handling with
      v3 matrix version; replace provenance_level "v2.1-required" / downgrade-declaration 2.1 logic with
      v3-required (P-05 downgrade only if evidence ceiling below v3-required). Closes
      F-CONSUMER-LOCAL:prepare-audit.ts:schema_version.
  precheck_evidence_v3:
    target: .agents/skills/plan-audit-archiver/scripts/pre-check-evidence.ts
    change: >-
      Import the shared parser. Validate every referenced receipt against audit-evidence-receipt/v3::evidence-receipt
      (reject non-v3 schema_version instead of silently stripping it at the receipt schema_version read).
      No boundary-matrix or MODEL_REVIEW responsibility. Closes F-CONSUMER-LOCAL:pre-check-evidence.ts:schema_version.
  manifest_sync:
    target: scripts/lib/governance-surface-manifest.yaml
    change: >-
      Update sha256 of prepare-audit.ts, pre-check-evidence.ts, validate-audit.ts after v3 edits; confirm the
      4 now-closed findings no longer appear as OPEN; keep scope-lock-template.json findings OPEN.
  conformance_extension:
    targets:
      - scripts/lib/run-conformance.ts
      - scripts/lib/conformance-corpus/corpus.json
    change: >-
      Declare the v3-ified prepare-audit/pre-check-evidence/validate-audit discriminators as consumers where
      they parse v3 documents; extend corpus with v3 audit-contract/report/latest/boundary-matrix samples and a
      mismatch probe asserting the gate rejects a v1 matrix or a 2.1 contract.
  tests_v3:
    targets:
      - .agents/skills/plan-audit-archiver/scripts/__tests__/validate-audit.test.ts
      - .agents/skills/plan-audit-archiver/scripts/__tests__/prepare-audit.test.ts
      - .agents/skills/plan-audit-archiver/scripts/__tests__/pre-check-evidence.test.ts
    change: >-
      Move all fixtures and assertions from schema_version "2.1"/"1.0"/v2.1-required and audit-boundary-matrix/v1
      to the v3 pairs. Add positive cases: v3 contract/report parse OK, v3 matrix READY consumed; negative cases:
      v1 matrix rejected (BOUNDARY_MATRIX_SCHEMA_INVALID), 2.1 contract rejected (SCHEMA_VERSION), non-v3 receipt
      rejected by pre-check-evidence.

findings_disposition:
  closes:
    - F-CONSUMER-LOCAL:validate-audit.ts:schema_version-2.1
    - F-CONSUMER-LOCAL:validate-audit.ts:audit-boundary-matrix/v1
    - F-CONSUMER-LOCAL:prepare-audit.ts:schema_version
