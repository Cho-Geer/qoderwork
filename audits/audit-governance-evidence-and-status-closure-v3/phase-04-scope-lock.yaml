purpose: >-
  Freeze PHASE-04: v3-ify the audit chain. Rewire prepare-audit.ts, pre-check-evidence.ts,
  and validate-audit.ts to consume and emit only v3 document kinds via the shared parser
  (parseAuditGovernanceV3Document), replacing every pre-v3 marker (schema_version "2.1",
  provenance levels v2.1-required/component-only, audit-boundary-matrix/v1, consumer-local
  receipt schema_version stripping). The v3 boundary matrix (audit-boundary-matrix/v3::boundary-matrix)
  becomes the matrix the audit chain consumes; MODEL_REVIEW binds to it; ACCEPT remains fail-closed.
  Closes 4 OPEN findings. Does NOT publish a report or LATEST pointer (that is PHASE-05).

scope_decision:
  chosen: audit_chain_v3_discriminators_plus_matrix_consumption
  deferred:
    - scope-lock-template.json pre-v3 schema_version and provenance-exposure findings (remain OPEN; target PHASE-05 micro-scope)
  rationale: >-
    Phase 4 completes the audit machinery so a v3 phase can be independently audited and
    ACCEPTed. It consumes the PHASE-03 boundary matrix and v3 receipts but does not itself
    issue a publication; PHASE-05 adds immutable report + CAS LATEST on top of this chain.

requirements_selection:
  selected:
    - requirement_id: REQ-005
      title: audit verdict and publication remain fail-closed and immutable
      decision_cases: [DC-010, DC-011]
      evidence_level: file-integration
  unselected_cases_are_out_of_scope: true

