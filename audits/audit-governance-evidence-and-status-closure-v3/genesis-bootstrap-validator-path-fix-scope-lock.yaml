purpose: >-
  Freeze one narrow correction to the v3 PLAN_SET admission validator: resolve the
  trusted authority documents (canonical contract and approval decision) against an
  explicitly provided governance worktree root, while preserving the path guard for
  receipt/evidence paths and preserving every existing sha256, schema-pair, and
  HUMAN_USER APPROVED binding check. This scope lock is not a PLAN_SET, not a phase
  scope lock, not a phase ACCEPT, not an audit report, and not a LATEST pointer.

root_cause:
  diagnosis: >-
    validate-plan.ts resolveInput passes the PLAN_SET directory as the root to
    guardRelativePath for canonical and approval paths. guardRelativePath correctly
    rejects any path escaping that root. But the canonical contract and approval
    decision are trusted authority documents that live outside the PLAN_SET directory
    by design (canonical hash_direction and blueprint section 2.2). The two contracts
    are therefore mutually unsatisfiable and no formal v3 PLAN_SET referencing the real
    external canonical can be admitted.
  guard_disposition: >-
    guardRelativePath itself is correct and remains required for receipt/evidence path
    escape protection (REQ-004 nested_within_evidence_root). The shared parser
    scripts/lib/audit-governance-schema-v3.ts is NOT modified by this scope lock.
  observed_failure:
    command: bun run .agents/skills/deterministic-implementation-planning/scripts/validate-plan.ts plans/audit-governance-evidence-and-status-closure-v3/formal-plan-set
    exit_code: 1
    errors: [ERR_PATH_GUARD on Canonical contract, ERR_PATH_GUARD on Approval decision]

fix_contract:
  required_behavior:
    - validator accepts an explicit governance worktree root (second positional argument; required when the index references authority documents outside the PLAN_SET directory)
    - canonical contract and approval decision relative paths resolve against the governance worktree root, not the PLAN_SET directory
    - absolute authority paths, NUL bytes, and paths escaping the governance worktree root remain rejected with ERR_PATH_GUARD
    - sha256 comparison, schema-pair validation, and HUMAN_USER APPROVED binding checks are unchanged
    - receipt/evidence path guard semantics are unchanged
  forbidden:
    - any change to scripts/lib/audit-governance-schema-v3.ts
    - any change to the SCHEMA_PAIRS registry or discriminator semantics
    - weakening or removing guardRelativePath
    - accepting absolute authority paths or paths escaping the governance root
    - pre-v3 input, compatibility entry, generic bypass, phase ACCEPT, report, or LATEST publication

