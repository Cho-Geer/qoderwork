created_at: '2026-07-27T00:10:00Z'

purpose: >-
  Freeze PHASE-03: v3-ify the audit evidence chain. Add a phase-projection generator,
  rewrite the boundary precheck to consume projection-declared explicit receipt paths
  (no directory enumeration) and emit a v3 boundary matrix, upgrade the evidence
  receipt generator and template to the dual-observation v3 contract, v3-ify the
  capture-state receipt discrimination, and synchronize the surface manifest and
  conformance set. The precheck remains mechanical and never issues a verdict; it
  outputs only READY_FOR_LLM_REVIEW or BLOCKED. Formal phase ACCEPT remains out of
  scope and depends on the phase 4 audit chain.

scope_decision:
  chosen: projection_generator_plus_receipt_precheck_v3_plus_capture_state_v3
  capture_state_classification: >-
    The capture-state repository-state receipt is classified as
    audit-evidence-receipt/v3::evidence-receipt because the shared parser SCHEMA_PAIRS
    has no dedicated state-receipt kind and the parser is not writable; this matches the
    classification already used for pre-change captures in this plan.
  deferred:
    - scope-lock-template.json pre-v3 schema_version and provenance-exposure findings (not core to the evidence chain; remain OPEN)
    - prepare-audit.ts, pre-check-evidence.ts, validate-audit.ts v3-ification (phase 4)
  rationale: >-
    Phase 3 builds the projection/receipt/matrix evidence chain that the phase 4 audit
    chain consumes. It does not depend on phase 4 because the precheck outputs only
    READY_FOR_LLM_REVIEW or BLOCKED and never consumes an audit contract.

