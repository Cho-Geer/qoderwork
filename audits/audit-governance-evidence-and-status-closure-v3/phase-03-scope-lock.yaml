fix_contract:
  projection_generator:
    target: .agents/skills/plan-audit-archiver/scripts/generate-phase-projection.ts
    change: >-
      New script. Generate a phase projection (audit-phase-projection/v3::phase-projection)
      that binds the approved canonical path/hash, its own phase scope-lock path/hash, the
      selected REQ/DC identities, fixture/oracle IDs, and explicit receipt path declarations.
      Missing, duplicate, unselected, or mutated REQ/DC, fixture, oracle, canonical hash, or
      scope-lock hash is BLOCKED (ERR_CANONICAL_HASH / ERR_SCOPE_LOCK_HASH / ERR_CASE_SELECTION).
      Must use the shared parser. Satisfies REQ-003 DC-005 (READY) and DC-006 (BLOCKED).
  boundary_precheck:
    target: .agents/skills/plan-audit-archiver/scripts/audit-boundary-precheck.ts
    change: >-
      Replace the boundary-contract/v1 input and the recursive evidence-directory enumeration
      with consumption of a v3 phase projection that declares explicit receipt paths. Validate
      each declared receipt path is nested within the approved evidence root (reject path escape
      and symlink escape with ERR_RECEIPT_PATH), exists (ERR_RECEIPT_NOT_FOUND), and matches its
      declared hash, REQ/DC identity, fixture, oracle, dual observation, and forbidden-side-effect
      observation. Emit a v3 boundary matrix (audit-boundary-matrix/v3::boundary-matrix) binding
      the projection path/hash and each covered receipt path/hash. Output only
      READY_FOR_LLM_REVIEW or BLOCKED. Must use the shared parser. Satisfies REQ-004 DC-007/008/009.
    preserved: the precheck never issues an audit verdict.
  receipt_generator:
    target: .agents/skills/plan-audit-archiver/scripts/generate-evidence-receipt.ts
    change: >-
      Upgrade the receipt to audit-evidence-receipt/v3::evidence-receipt via the shared parser.
      Add decision_case_id, the nested execution.observed (PASS/FAIL consistent with the real
      exit_code), domain_observation.result (exact comparison against the DC expected.result),
      domain_observation.error_code, forbidden_side_effects_observed, and projection/canonical
      hash binding. Preserve the trusted-runner guarantees: observed derived only from exit_code,
      override limited to BLOCKED/NOT_RUN/N/A, EV-NNN/ORACLE-NNN validation, cd-prefix command
      rule, trivial-command rejection, cwd containment, write-once protection, and rollback on
      write failure. execution.observed and domain_observation.result remain distinct and neither
      is inferred from prose.
  receipt_template:
    target: .agents/skills/plan-audit-archiver/templates/evidence-receipt-template.json
    change: >-
      Upgrade to audit-evidence-receipt/v3 with the dual-observation fields and decision_case_id,
      eliminating the prior generator/template decision_case_id drift.
  capture_state:
    target: .agents/skills/plan-audit-archiver/scripts/capture-state.ts
    change: >-
      Discriminate the repository-state receipt as audit-evidence-receipt/v3::evidence-receipt via
      the shared parser, replacing the consumer-local schema_version 1.0. Preserve the git
      porcelain capture, per-path content_sha256, scope-lock binding, freeze behavior, and
      canonical_sha256 stability.
  manifest_sync:
    target: scripts/lib/governance-surface-manifest.yaml
    change: >-
      Add a registered entry for generate-phase-projection.ts; add scripts/lib/audit-governance-schema-v3.ts
      to the allowed_references of audit-boundary-precheck.ts, generate-evidence-receipt.ts, and
      capture-state.ts; and update the sha256 of every modified or added registered asset so the
      surface scan does not self-flag an illegal reference or hash drift.
  conformance_extension:
    targets:
      - scripts/lib/run-conformance.ts
      - scripts/lib/conformance-corpus/corpus.json
    change: >-
      Declare the rewired audit-boundary-precheck.ts, generate-evidence-receipt.ts, capture-state.ts,
      and the new generate-phase-projection.ts as v3 consumers in the conformance runner, and extend
      the independent corpus with field-level legal and single-mutation samples plus dual-observation,
      orphan-receipt, and path-escape mismatch probes for the projection/receipt/matrix kinds. The
      corpus remains an independent oracle not generated by the parser or any consumer under test.
  formal_plan_set_phase_row:
    target: plans/audit-governance-evidence-and-status-closure-v3/formal-plan-set/00-plan-index.md
    change: >-
      Add the PHASE-03 manifest row (depends on PHASE-01, Status NOT_STARTED) and the corresponding
      03-phase-receipt-projection-precheck.md phase file, keeping validate-phase-progression exit 0.

