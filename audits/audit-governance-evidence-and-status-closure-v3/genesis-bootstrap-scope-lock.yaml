      non_v3_plan_input: ERR_PLAN_SCHEMA_UNSUPPORTED
      absent_or_nonapproved_decision: ERR_APPROVAL_MISSING
      canonical_or_approval_hash_drift: ERR_APPROVAL_BINDING
      escaped_path: ERR_PATH_GUARD
      duplicate_or_second_genesis_identity: ERR_BOOTSTRAP_REUSE
