      scope_approval_hash_mismatch: ERR_BOOTSTRAP_APPROVAL
      closed_without_posthoc_v3_plan_set: ERR_BOOTSTRAP_POSTHOC_VALIDATION
  plan_admission:
    required_index_pair: audit-plan-set/v3::plan-set-index
    required_canonical_pair: audit-governance/v3::canonical-requirements
    required_decision: exact_hash_bound_HUMAN_USER_APPROVED_approval_decision
    admission_success: PASS
    admission_failure_side_effects_forbidden: [phase_admission, scope_lock_creation, implementation_start, receipt_write, audit_report_write, latest_pointer_write]
  bootstrap_state_order:
    allowed: DRAFT->HUMAN_APPROVED->IMPLEMENTING->POSTHOC_V3_VALIDATED->CLOSED
    blocked_on_any_failure: true

