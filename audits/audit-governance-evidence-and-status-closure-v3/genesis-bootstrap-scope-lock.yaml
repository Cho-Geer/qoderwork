implementation_goal: >-
  Establish the shared audit-governance v3 parser, path guard, hash/identity and
  evidence-level comparators, then make PLAN_SET admission consume that shared
  implementation. This is the bootstrap-only prerequisite for a later formal v3
  PLAN_SET; it neither admits a phase nor implements any later governance surface.

