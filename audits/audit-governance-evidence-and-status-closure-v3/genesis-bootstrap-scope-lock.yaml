  check_id: GPOS-001
  fixture: >-
    A fresh temporary PLAN_SET with an audit-plan-set/v3 index, the approved
    audit-governance/v3 canonical path and SHA-256, and an exact HUMAN_USER
    approval decision binding the same hashes.
  expected: { result: PASS, phase_admission: false, implementation_start: false }
  oracle: PLAN_SET structural admission succeeds and no lifecycle artifact is written
  additional_check:
    check_id: GPOS-002
    fixture: one source object for each of the seventeen exact schema/document-kind pairs
    expected: { result: PASS, parser_origin: shared_v3_parser }
    oracle: each known pair is parsed by the shared parser without field-shape inference

single_mutation_negatives:
  - check_id: GNEG-001
    mutation: replace only the plan schema pair with a non-v3 pair
    expected_error: ERR_PLAN_SCHEMA_UNSUPPORTED
    must_not_happen: [phase_admission, scope_lock_creation, implementation_start]
  - check_id: GNEG-002
    mutation: change only the canonical SHA-256 while retaining the v3 document pairs
    expected_error: ERR_APPROVAL_BINDING
    must_not_happen: [phase_admission, receipt_write, audit_report_write]
  - check_id: GNEG-003
    mutation: remove only the approval decision binding
    expected_error: ERR_APPROVAL_MISSING
    must_not_happen: [phase_admission, scope_lock_creation, implementation_start]
  - check_id: GNEG-004
    mutation: replace only one known schema/document-kind discriminator pair with a mismatched pair
    expected_error: ERR_SCHEMA_DISCRIMINATOR
    must_not_happen: [plan_admission, projection_generation, matrix_write]
  - check_id: GNEG-005
    mutation: attempt a second genesis identity after the first identity is recorded
    expected_error: ERR_BOOTSTRAP_REUSE
    must_not_happen: [implementation_start, phase_accept, audit_report_write, latest_pointer_write]
  - check_id: GNEG-006
    mutation: create a bootstrap receipt state before a hash-approved scope decision
    expected_error: ERR_BOOTSTRAP_PRECONDITION
    must_not_happen: [implementation_start, phase_accept, audit_report_write, latest_pointer_write]
  - check_id: GNEG-007
    mutation: attempt to close bootstrap without a fresh formal v3 PLAN_SET admission
    expected_error: ERR_BOOTSTRAP_POSTHOC_VALIDATION
    must_not_happen: [phase_accept, audit_report_write, latest_pointer_write]
  - check_id: GNEG-008
    mutation: retain an approval decision whose scope-lock SHA-256 differs from this frozen scope lock
    expected_error: ERR_BOOTSTRAP_APPROVAL
    must_not_happen: [pre_change_capture, implementation_start, phase_accept]

