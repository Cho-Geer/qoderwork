declared_v3_consumers:
  note: >-
    The conformance corpus exercises exactly these declared v3 consumers, all of
    which use the shared parser. Scripts that perform consumer-local schema
    interpretation are NOT declared v3 consumers in this phase; the surface scanner
    reports them as OPEN findings.
  consumers:
    - scripts/lib/audit-governance-schema-v3.ts (shared parser, the oracle source)
    - .agents/skills/deterministic-implementation-planning/scripts/validate-plan.ts
    - scripts/lib/scan-governance-surface.ts (new)
    - scripts/lib/run-conformance.ts (new)

surface_manifest_contract:
  schema_pair: audit-governance-surface/v3::governance-surface-manifest
  required_entries: >-
    Every active governance rule, document, Skill, script, template, test, CLI-help
    surface, and index/log interface appears exactly once with path, sha256, owner,
    consumers, allowed_references, and forbidden_references.
  historical_classification: >-
    Historical or quarantined paths (for example legacy-boundary-contract-exemptions.json)
    appear by path and HISTORICAL/QUARANTINED classification only; the scanner never
    opens, parses, migrates, or displays their content.
  forbidden: [unregistered_active_asset, duplicate_entry, hash_drift, illegal_reference, pre_v3_exposing_active_asset]

scanner_contract:
  exported_behavior: findings-first complete scan
  required_behavior:
    - the scanner runs every declared check to completion; it does not stop at the first mismatch
    - every discovered mismatch is retained as a stable finding with finding_id, classification, evidence location, and reproducible reason
    - on any blocking finding the scanner exits nonzero after reporting the complete finding set
    - NO_OPEN_FINDINGS is reported only when manifest coverage, executed checks, retained findings, and their closures are all verified
  consumer_local_findings_to_surface:
    - F-PHASE01-TEMPLATE-PROGRESSION-MARKER (v3 PLAN-SET-TEMPLATE.md omits the progression marker)
    - phase-progression.ts consumer-local phase-progression/v1 interpretation
    - validate-audit.ts consumer-local 2.1 and audit-boundary-matrix/v1 interpretation
    - audit-boundary-precheck.ts consumer-local boundary-contract/v1 interpretation
    - capture-state.ts / prepare-audit.ts / generate-evidence-receipt.ts / pre-check-evidence.ts consumer-local schema_version interpretation
    - scope-lock-template.json and evidence-receipt-template.json pre-v3 schema_version and provenance exposure
  these_findings_are_OPEN_and_inherited: true

conformance_contract:
  schema_pair: audit-governance-conformance/v3::contract-conformance-report
  corpus: >-
    An independent hash-bound corpus with at least one legal sample and one
    single-field mutation sample for every schema pair, field, enum, error code,
    state transition, and forbidden side effect. The corpus is an independent oracle
    and is not generated by the shared parser or any consumer under test.
  runner_required_behavior:
    - run the same corpus through every declared v3 consumer
    - compare normalized result, state, error code, forbidden-side-effect observation, and output hash
    - any consumer disagreement is a blocking finding
  mismatch_probes: >-
    Intentional document_kind, error_code, dual-observation, orphan-receipt,
    consumer-local-parser, and CAS-semantic mismatches must be rejected by the gate;
    these kill tests prove the gate can fail.

