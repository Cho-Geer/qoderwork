purpose: >-
  Freeze PHASE-01: build the hash-bound governance surface manifest with a
  findings-first scanner, and the independent shared conformance corpus with a
  consumer-agreement runner and intentional mismatch probes. This phase builds
  infrastructure and surfaces findings only; it does not rewire existing consumers
  to the shared parser. Consumer-local schema interpretations discovered by the
  scanner are retained as OPEN findings for later phases (progression in phase 2,
  receipt/precheck in phase 3, audit validators in phase 4), never silently closed.

scope_decision:
  chosen: build_infrastructure_and_surface_findings_only
  rejected: rewire_all_consumers_to_shared_parser_in_this_phase
  rationale: >-
    Blueprint section 3.1 sequences consumer migration into phases 2-4. PHASE-01
    establishes the discovery and conformance machinery and reports the complete
    finding set. NO_OPEN_FINDINGS is not claimed by this phase; the consumer-local
    findings are intentionally OPEN and inherited by later phases.

