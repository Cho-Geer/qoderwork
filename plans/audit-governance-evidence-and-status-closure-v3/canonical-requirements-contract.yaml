scope:
  included:
    - v3 Plan admission and completion-gate validation
    - v3 canonical-to-projection-to-receipt-to-matrix audit boundary
    - v3 audit validation and immutable report publication
    - shared schema parser, surface manifest/validator, conformance corpus/runner, templates, tests, and governance logs
  excluded:
    - any pre-v3 Plan, profile, bypass record, receipt, audit report, or status text
    - compatibility, migration, adapter, reader, fixture, or regression support for pre-v3 Plans
    - work-one product code, database schema, serve lifecycle, LLM permissions, npm dependencies

