approval_binding:
  required_schema_version: audit-governance-approval/v3
  decision_record_path: audits/audit-governance-evidence-and-status-closure-v3/approval-decision-bootstrap-amendment.json
  status_source: external_hash_bound_decision_record_only
  required_fields:
    - decision
    - approved_by
    - approved_at
    - approved_artifacts.blueprint.path
    - approved_artifacts.blueprint.sha256
    - approved_artifacts.canonical_contract.path
    - approved_artifacts.canonical_contract.sha256
  supersedes_immutable_decision:
    path: audits/audit-governance-evidence-and-status-closure-v3/approval-decision.json
    sha256: 65d13645477666f75a0e2dbd7fe651181c0a0cf0f9287c2972d685e707bcb36b
    effect: historical_design_approval_only
  rule: >-
    No PLAN_SET, scope-lock, pre-change receipt, code change, phase audit, report,
