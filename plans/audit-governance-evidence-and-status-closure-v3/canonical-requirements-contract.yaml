completion_definition:
  design_ready_when: >-
    An APPROVED audit-governance-approval/v3 record binds this exact canonical contract
    and its Blueprint by SHA-256.
  plan_ready_when: >-
    A v3-only PLAN_SET validates against the approved canonical contract and approval record.
  implementation_ready_when: >-
    A code write is allowed only when either the genesis bootstrap contract is active
    with every required prewrite artifact and exact human-approved scope lock, or a
    normal v3 phase independently satisfies P-02/P-02A before code writes.
  governance_complete_when: >-
    Every selected DC has retained exact evidence, every hard gate passes, MODEL_REVIEW
    is complete where eligible, validate-audit exits zero, surface scanning has a complete
    closed finding set, the independent conformance corpus and mismatch probes pass, and
    immutable publication succeeds. If genesis bootstrap was used, it is CLOSED only
    after posthoc v3 validation and a fresh formal v3 PLAN_SET admission.
